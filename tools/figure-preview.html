<!doctype html>
<html><head><meta charset="utf-8"><title>figure preview</title>
<style>html,body{margin:0;height:100%;background:#111}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { seatedGeometry, standingFigure, figureMaterial, PALETTES } from '../js/cultist-model.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background = new THREE.Color(0x2a2a30);
s.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 4, 5); s.add(d);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50); cam.position.set(0.3, 1.9, 5.2);
const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, 1.2, 0);
const mat = figureMaterial();
const seated = seatedGeometry();
const b = new THREE.Mesh(seated.body, mat), h = new THREE.Mesh(seated.head, mat);
b.position.set(-1.6, 0.6, 0); h.position.set(-1.6, 0.6 + 0.72 * 1.35, 0); s.add(b, h);
const stand = standingFigure(PALETTES.stagehand, mat); stand.position.set(0, 0, 0); s.add(stand);
const heck = standingFigure(PALETTES.heckler, mat); heck.position.set(1.6, 0, 0); heck.armR.rotation.x = -2.4; s.add(heck);
window.view = (x, y, z, tx, ty, tz) => { cam.position.set(x, y, z); ctl.target.set(tx, ty, tz); };
r.setAnimationLoop(() => { ctl.update(); r.render(s, cam); });
</script></body></html>

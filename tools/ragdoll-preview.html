<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leno Ragdoll Preview</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root { color-scheme: dark; --bg: #0b0b0f; --panel: #16161d; --text: #ddd; --muted: #888; --accent: #6cf; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, sans-serif; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; top: 10px; left: 10px; width: 260px; background: color-mix(in srgb, var(--panel) 92%, transparent);
          border: 1px solid #2a2a35; border-radius: 8px; padding: 10px 12px; max-height: calc(100% - 40px); overflow: auto; }
    #ui h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: grid; grid-template-columns: 88px 1fr 38px; align-items: center; gap: 6px; margin: 3px 0; }
    label span.v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; }
    .row { display: flex; gap: 6px; margin: 8px 0 4px; flex-wrap: wrap; }
    button { background: #253040; color: var(--text); border: 1px solid #38465a; border-radius: 5px; padding: 4px 10px; cursor: pointer; }
    button:hover { background: #2f3d52; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 4px; }
    #stats { white-space: pre; font: 11px/1.4 ui-monospace, monospace; color: #9fb; margin-top: 8px; }
    #msg { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: var(--muted); }
    @media (max-width: 600px) { #ui { left: 8px; right: 8px; width: auto; max-height: 45%; } }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Leno active ragdoll</h1>
  <h2>Body</h2>
  <label>support <input id="support" type="range" min="0" max="1" step="0.01" value="1"><span class="v"></span></label>
  <label>VNC assist <input id="vncW" type="range" min="0" max="1" step="0.01" value="1"><span class="v"></span></label>
  <label>direct noise <input id="directW" type="range" min="0" max="1" step="0.01" value="0"><span class="v"></span></label>
  <h2>Command</h2>
  <label>forward <input id="forward" type="range" min="0" max="1" step="0.01" value="0"><span class="v"></span></label>
  <label>backward <input id="backward" type="range" min="0" max="1" step="0.01" value="0"><span class="v"></span></label>
  <label>turn (+left) <input id="turn" type="range" min="-1" max="1" step="0.01" value="0"><span class="v"></span></label>
  <label>startle <input id="startle" type="range" min="0" max="1" step="0.01" value="0"><span class="v"></span></label>
  <label>groom <input id="groom" type="range" min="0" max="1" step="0.01" value="0"><span class="v"></span></label>
  <label>feed / talk <input id="feed" type="range" min="0" max="1" step="0.01" value="0"><span class="v"></span></label>
  <div class="row">
    <button id="reset">Reset</button>
    <button id="zero">Zero commands</button>
    <button id="kick">Kick</button>
  </div>
  <label style="grid-template-columns: auto 1fr"><input id="yawFb" type="checkbox" checked> haltere yaw feedback</label>
  <label style="grid-template-columns: auto 1fr"><input id="dbg" type="checkbox"> collision shapes</label>
  <label style="grid-template-columns: auto 1fr"><input id="follow" type="checkbox" checked> follow camera</label>
  <div id="stats"></div>
</div>
<div id="msg">loading…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { HOST_SCALE } from '../js/leno.js';
import { initPhysics, RagdollLeno, RAPIER_URL, SUPPORT_TUNING, MUSCLE_TUNING } from '../js/ragdoll.js';
import { VNC_TUNING } from '../js/vnc.js';
import { VNC } from '../js/vnc.js';

const $ = (id) => document.getElementById(id);
const msg = $('msg');
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c22);
scene.add(new THREE.HemisphereLight(0xdde8ff, 0x302820, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun, sun.target);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
camera.position.set(4.5, 3.6, 7.5);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;

// ---- ground: flat floor + box platform (top at y = 1.167, like the TUURD stage)
const PLATFORM_TOP = 1.167;
const floor = new THREE.Mesh(new THREE.BoxGeometry(60, 0.2, 60), new THREE.MeshStandardMaterial({ color: 0x3a3f48 }));
floor.position.y = -0.1; floor.receiveShadow = true;
const plat = new THREE.Mesh(new THREE.BoxGeometry(24, PLATFORM_TOP, 24), new THREE.MeshStandardMaterial({ color: 0x6b4a3a }));
plat.position.y = PLATFORM_TOP / 2; plat.receiveShadow = true; plat.castShadow = true;
const grid = new THREE.GridHelper(24, 24, 0x000000, 0x000000);
grid.position.y = PLATFORM_TOP + 0.002; grid.material.opacity = 0.25; grid.material.transparent = true;
scene.add(floor, plat, grid);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---- UI
const ids = ['support', 'vncW', 'directW', 'forward', 'backward', 'turn', 'startle', 'groom', 'feed'];
const ui = {};
for (const id of ids) {
  const el = $(id), out = el.parentElement.querySelector('.v');
  const upd = () => { ui[id] = +el.value; out.textContent = (+el.value).toFixed(2); };
  el.addEventListener('input', upd); upd();
}
ui.yawFb = true;
$('yawFb').onchange = (e) => { ui.yawFb = e.target.checked; };
function setUI(obj) {
  for (const [k, v] of Object.entries(obj)) { const el = $(k); if (el) { el.value = v; el.dispatchEvent(new Event('input')); } }
}

// ---- load
msg.textContent = 'loading Rapier + Leno…';
const [{ RAPIER, world }, gltf] = await Promise.all([
  initPhysics(),
  new GLTFLoader().loadAsync('../assets/grey_leno.glb'),
]);
const model = gltf.scene;
model.scale.setScalar(HOST_SCALE);
model.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
scene.add(model);
const rag = new RagdollLeno({ RAPIER, world, model, groundMeshes: [floor, plat] });
const START = new THREE.Vector3(0, PLATFORM_TOP, 0);
rag.place(START, 0);
const dbg = rag.makeDebugGroup(); dbg.visible = false; scene.add(dbg);
const vnc = new VNC();
msg.textContent = '';

$('reset').onclick = () => { rag.reset(); vnc.reset(); };
$('zero').onclick = () => setUI({ forward: 0, backward: 0, turn: 0, startle: 0, groom: 0, feed: 0 });
$('kick').onclick = () => rag.applyImpulse('chest', new THREE.Vector3((Math.random() - 0.5) * 80, 20, (Math.random() - 0.5) * 80));
$('dbg').onchange = (e) => { dbg.visible = e.target.checked; };

// ---- direct "brain chaos": smoothed random activations per muscle (Ornstein-Uhlenbeck)
const direct = Object.fromEntries(rag.muscleNames.map((n) => [n, Math.random()]));
function updateDirect(dt) {
  const a = 1 - Math.exp(-dt * 4);
  for (const n in direct) direct[n] += ((Math.random() < 0.5 ? 0 : 1) * Math.random() - direct[n]) * a * (0.5 + Math.random());
}

const final = {};
function control(dt) {
  const cmd = { forward: ui.forward, backward: ui.backward, turn: ui.turn, startle: ui.startle, groom: ui.groom, feed: ui.feed };
  const v = vnc.update(dt, cmd, ui.yawFb ? { yawRate: rag.getState().yawRate } : null);
  if (ui.directW > 0) updateDirect(dt);
  for (const n of rag.muscleNames) {
    const x = ui.vncW * (v[n] ?? 0) + ui.directW * direct[n];
    final[n] = x > 1 ? 1 : x < 0 ? 0 : x;
  }
  rag.setActivations(final);
  rag.setSupport(ui.support);
}

// ---- headless test helper: run N seconds of simulation synchronously (60 Hz control)
function sim(seconds, cmd = {}, opt = {}) {
  if (opt.reset) { rag.reset(); vnc.reset(); }
  setUI({ forward: 0, backward: 0, turn: 0, startle: 0, groom: 0, feed: 0, ...cmd });
  const dt = 1 / 60, n = Math.round(seconds * 60);
  const s0 = rag.getState();
  let tStep = 0, tMax = 0, minPel = 1e9, nan = false, sumUp = 0;
  const trace = [];
  for (let i = 0; i < n; i++) {
    control(dt);
    const t0 = performance.now();
    rag.step(dt);
    rag.syncSkin();
    const ms = performance.now() - t0;
    tStep += ms; tMax = Math.max(tMax, ms);
    const st = rag.getState();
    minPel = Math.min(minPel, st.pelvisHeight);
    sumUp += st.upright;
    if (!Number.isFinite(st.root.x + st.root.z + st.pelvisHeight + st.heading)) nan = true;
    if (i % 60 === 59) trace.push([+(st.root.x).toFixed(2), +(st.root.z).toFixed(2), +(st.pelvisHeight).toFixed(2), +(st.heading * 57.3).toFixed(0)]);
  }
  const s1 = rag.getState();
  const fwd0 = new THREE.Vector3(Math.sin(s0.heading), 0, Math.cos(s0.heading));
  return {
    seconds, cmd,
    msPerFrame: +(tStep / n).toFixed(3), maxMs: +tMax.toFixed(2),
    dx: +(s1.root.x - s0.root.x).toFixed(2), dz: +(s1.root.z - s0.root.z).toFixed(2),
    progress: +s1.root.clone().sub(s0.root).dot(fwd0).toFixed(2),
    dHeadingDeg: +(((s1.heading - s0.heading + 3 * Math.PI) % (2 * Math.PI) - Math.PI) * 57.3).toFixed(1),
    pelvisHeight: +s1.pelvisHeight.toFixed(3), minPelvis: +minPel.toFixed(3),
    upright: +s1.upright.toFixed(2), meanUpright: +(sumUp / n).toFixed(2), fallen: s1.fallen, nan,
    feet: s1.feetContact, trace,
  };
}

// ---- render loop
const clock = new THREE.Clock();
let frameMs = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta());
  const t0 = performance.now();
  control(dt);
  rag.step(dt);
  rag.syncSkin();
  frameMs += (performance.now() - t0 - frameMs) * 0.05;
  const st = rag.getState();
  if ($('follow').checked) {
    const tgt = new THREE.Vector3(st.root.x, st.root.y + 1.3, st.root.z);
    controls.target.lerp(tgt, 1 - Math.exp(-dt * 3));
  }
  controls.update();
  renderer.render(scene, camera);
  $('stats').textContent =
    `physics ${rag.stats.stepMs.toFixed(2)} ms (${rag.stats.substeps} substeps)\n` +
    `ctrl+phys+skin ${frameMs.toFixed(2)} ms\n` +
    `pelvis h ${st.pelvisHeight.toFixed(2)} m  upright ${st.upright.toFixed(2)}\n` +
    `heading ${(st.heading * 57.3).toFixed(0)}°  fallen ${st.fallen}\n` +
    `feet L ${st.feetContact.l ? '■' : '□'}  R ${st.feetContact.r ? '■' : '□'}\n` +
    `Rapier ${RAPIER_URL.match(/@([\d.]+)/)[1]}`;
});

window.rd = { SUPPORT_TUNING, MUSCLE_TUNING, VNC_TUNING, THREE, rag, vnc, world, RAPIER, sim, setUI, ui, camera, controls, scene, renderer };
console.log('ragdoll preview ready');
</script>
</body>
</html>
